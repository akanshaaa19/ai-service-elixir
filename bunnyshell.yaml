kind: Environment
name: eli
type: primary

components:
  - kind: Application
    name: ai-service-elixir
    gitRepo: 'https://github.com/akanshaaa19/ai-service-elixir.git'
    gitBranch: main
    gitApplicationPath: /
    dockerCompose:
      build:
        context: ./
        dockerfile: Dockerfile
      ports:
        - '4001:4001'
      environment:
        PORT: '4001'
    hosts:
      - hostname: 'ai-service-elixir-{{ env.base_domain }}'
        path: /
        servicePort: 4001
        public: true
